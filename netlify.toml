# Netlify configuration for danielageorgieva.work (static Astro site + two booking functions).
# Every push to main is built and published with these settings.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The site used to be a Next.js app and Netlify still has its Next.js Runtime attached to
  # the project. This turns that plugin off so it does not fail the Astro build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` runs the Astro dev server and the functions together on http://localhost:8888.
[dev]
  command = "npm run dev"
  targetPort = 4321

# --- Redirects ---------------------------------------------------------------------------
# Rules are read top to bottom and the first match wins.

# The root goes to the visitor's language: Bulgarian browsers to /bg/, everyone else to /en/.
# `force` is needed because dist/index.html exists (the fallback for hosts without these
# rules) and a file normally wins over a redirect.
[[redirects]]
  from = "/"
  to = "/bg/"
  status = 302
  force = true
  conditions = { Language = ["bg"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# Not-found pages in the right language. Without `force` these only apply when no file,
# and no function, matches the URL, so real pages, /_astro/*, /cv/*.pdf, /api/* and
# /.well-known/discord are untouched. The more specific rule has to come first.
[[redirects]]
  from = "/bg/*"
  to = "/bg/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/en/404.html"
  status = 404

# --- Headers -----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # The Content-Security-Policy is not here: scripts/csp-headers.mjs writes it to
    # dist/_headers at the end of every build, with the hashes of the inline scripts that
    # are in the pages. Netlify applies that file and these headers together.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # The hidden CTF flag, for people who read response headers (see src/scripts/motion/flag.ts).
    X-Flag = "dg{l3ts_t4lk}"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"

# Astro puts a content hash in every file name under /_astro/, so they can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Discord domain verification. The file has no extension, so its type is stated.
[[headers]]
  for = "/.well-known/discord"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
