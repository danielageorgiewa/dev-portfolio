<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:#f2f0ed;
        display:flex;align-items:center;gap:64px;padding:0 96px;box-sizing:border-box;
        font-family:'Inter Tight',system-ui,sans-serif}
  .blush{position:absolute;left:26%;top:50%;width:900px;aspect-ratio:1;
         transform:translate(-50%,-50%);border-radius:50%;
         background:radial-gradient(circle at 42% 38%, rgba(168,135,124,.4), rgba(168,135,124,0) 70%);
         filter:blur(24px)}
  .dots{position:absolute;inset:0;opacity:.5;
        background-image:radial-gradient(rgba(46,37,35,.09) 1px, transparent 1px);
        background-size:5px 5px}
  .col{position:relative;z-index:5}
  .portrait{position:relative;z-index:5;flex:0 0 auto;width:260px;height:260px;border-radius:50%;
            overflow:hidden;box-shadow:0 0 0 3px rgba(168,135,124,.65), 0 16px 38px rgba(46,37,35,.12)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
  .role{font-size:16px;letter-spacing:.24em;white-space:nowrap;text-transform:uppercase;color:#8a7f79}
  h1{margin:18px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;
     font-size:104px;line-height:.96;letter-spacing:-.022em;color:#2e2523}
  h1 span{font-style:italic}
</style>
<div class="card">
  <div class="blush"></div><div class="dots"></div>
  <div class="portrait"><img src="../../public/images/daniela.jpg"></div>
  <div class="col">
    <div class="role">Софтуерен програмист · Пловдив, България · UTC+3</div>
    <h1>Даниела<br><span>Георгиева</span></h1>
  </div>
</div>
