<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1482">
<title>Northlight Trade — Homepage</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  body { margin: 0; background: #0d0d0d; font-family: Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; }
  * { box-sizing: border-box; }
  a { color: #10171E; } a:hover { color: #1B3A5C; }
</style>
</head>
<body>
<div style="width: 1482px; background: #111111; color: #FFFFFF;">

  <!-- hero: photo with the baked-in headline, own nav laid over the original bar -->
  <div style="position: relative; width: 1482px; height: 792px; overflow: hidden;">
    <img src="assets/b2b-hero.png" alt="Flat roof skylights installed on a terrace" style="position: absolute; inset: 0; width: 1482px; height: 792px; object-fit: cover;">

    <div style="position: absolute; top: 24px; left: 46px; width: 1392px; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 32px; border-radius: 12px; background: #191919;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 14.5px; font-weight: 600; color: #FFFFFF;">Accessories</span>
        <span style="display: flex; align-items: center; height: 34px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #111111; font-size: 14.5px; font-weight: 600;">Shop Skylights</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; position: absolute; left: 50%; transform: translateX(-50%);">
        <svg width="30" height="18" viewBox="0 0 30 18" fill="#FFFFFF"><path d="M0 17 9.5 1l6 10.5L20 4l10 13z"/></svg>
        <span style="width: 1px; height: 26px; background: rgba(255,255,255,0.35);"></span>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.2; text-transform: uppercase;">Northlight<br>Trade</span>
      </div>

      <div style="display: flex; align-items: center; gap: 20px;">
        <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,0.14);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        </span>
        <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.25);"></span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
          Trade account
        </span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; padding-right: 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M4 7h16l-1.4 12.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8Z"/><path d="M8.5 7V5.5a3.5 3.5 0 0 1 7 0V7"/></svg>
          Cart
          <span style="display: flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,0.22); font-size: 11.5px; font-weight: 700;">2</span>
        </span>
      </div>
    </div>
  </div>

  <!-- footer strip -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 26px 46px 34px; background: #111111; font-size: 13.5px; color: rgba(255,255,255,0.62);">
    <span>© 2026 Northlight Trade Ltd · Registered in England No 00000000 · VAT GB 000 0000 00</span>
    <div style="display: flex; gap: 26px;">
      <span>Terms</span><span>Privacy</span><span>Returns</span><span>Contact</span>
    </div>
  </div>

</div>
</body>
</html>
