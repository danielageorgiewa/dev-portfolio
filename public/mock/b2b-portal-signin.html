<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=520">
<title>Northlight Trade — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #0b0d0f; font-family: Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; }
  * { box-sizing: border-box; }
  a { color: #FFFFFF; } a:hover { color: #D6DEE4; }
</style>
</head>
<body>
<div style="position: relative; width: 520px; height: 824px; overflow: hidden;">
  <img src="assets/b2b-auth-bg.png" alt="" style="position: absolute; inset: 0; width: 520px; height: 824px; object-fit: cover;">

  <div style="position: absolute; top: 168px; left: 60px; width: 400px; border-radius: 10px; overflow: hidden; background: rgba(24,27,30,0.86); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 30px 80px rgba(0,0,0,0.45);">

    <!-- logo band -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 18px; height: 128px; background: linear-gradient(rgba(255,255,255,0.10), rgba(255,255,255,0.02)); border-bottom: 1px solid rgba(255,255,255,0.10);">
      <svg width="58" height="34" viewBox="0 0 58 34" fill="#FFFFFF"><path d="M0 33 18 3l11.5 20L38 9l20 24z"/></svg>
      <span style="width: 1px; height: 46px; background: rgba(255,255,255,0.45);"></span>
      <span style="font-size: 18px; font-weight: 500; letter-spacing: 0.02em; line-height: 1.24; color: #FFFFFF;">NORTHLIGHT<br>TRADE</span>
    </div>

    <div style="display: flex; flex-direction: column; padding: 34px 40px 34px;">
      <div style="text-align: center; font-size: 16.5px; font-weight: 700; color: #FFFFFF;">Welcome back</div>
      <div style="text-align: center; font-size: 14px; color: rgba(255,255,255,0.62); margin-top: 8px;">Enter your credentials to access your account</div>

      <div style="display: flex; align-items: center; gap: 14px; margin-top: 32px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.34);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.7"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>
        <span style="font-size: 15px; color: rgba(255,255,255,0.58);">name@company.co.uk</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin-top: 26px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.34);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.7"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <span style="flex: 1; font-size: 15px; letter-spacing: 0.22em; color: rgba(255,255,255,0.72);">••••••••</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.6"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20 20 4"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-top: 28px;">
        <span style="width: 17px; height: 17px; border-radius: 3px; background: #FFFFFF;"></span>
        <span style="font-size: 14.5px; color: rgba(255,255,255,0.86);">Remember me</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; height: 48px; margin: 30px 20px 0; border-radius: 6px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.24); font-size: 13.5px; font-weight: 600; letter-spacing: 0.16em; color: #FFFFFF;">LOG IN</div>

      <div style="text-align: center; font-size: 13.5px; color: rgba(255,255,255,0.62); margin-top: 26px;">
        No account? <span style="font-weight: 700; color: #FFFFFF;">Contact your account manager.</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
